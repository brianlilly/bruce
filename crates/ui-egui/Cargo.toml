[package]
name = "lightcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft egui frontend (Lightroom-style UI); swappable — nothing below depends on it (L5)"

[features]
## Show the full Develop/Edit UI (sliders, crop, masking, presets, compare/survey views).
## Off by default — Bruce is a gallery + people app; enable for the full LightCraft editing experience.
develop = []

[lints]
workspace = true

[dependencies]
