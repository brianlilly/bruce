[package]
name = "bruce"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "bruce"

[features]
## Enable the full Develop/Edit module (sliders, crop, masking, presets, compare/survey views).
develop = ["lightcraft-ui-egui/develop"]

[lints]
workspace = true

[dependencies]
lightcraft-engine = { workspace = true, features = ["sam", "face", "face-embed"] }
lightcraft-sysmem = { workspace = true }
lightcraft-ui-egui = { workspace = true }
lightcraft-codecs = { workspace = true }
lightcraft-raster = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for lightcraft.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }
